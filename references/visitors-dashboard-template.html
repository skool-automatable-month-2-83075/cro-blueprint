<script>
(() => {
  const D = JSON.parse(document.getElementById('visitors-data').textContent);
  const $ = i => document.getElementById(i);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const n = v => (v == null ? '-' : Number(v).toLocaleString());

  $('biz').textContent = D.business || 'Visitor read';
  $('url').textContent = D.page || '';
  $('stamp').textContent = [D.date, D.days ? `last ${D.days} days` : ''].filter(Boolean).join(' · ');

  // ---- the stage: one view at a time, heat drawn over the screenshot
  const views = (D.heatmap && D.heatmap.views) || [];
  // desktop first: it is where most sessions are, and the page is drawn the way most people saw it
  let vi = Math.max(0, views.findIndex(v => (v.width || 0) >= 700)), layers = {click:true, rageclick:true, scrolldepth:true};
  const COL = {click:[201,100,66], rageclick:[181,51,51], scrolldepth:[61,122,74]};
  const view = () => views[vi] || null;

  function draw() {
    const v = view(), cv = $('heat'), img = $('shot');
    if (!v || !cv) return;
    const W = img.clientWidth || v.width, H = img.clientHeight || 1;
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d'); ctx.clearRect(0,0,W,H);
    const scale = H / (v.height || 1);
    ['scrolldepth','click','rageclick'].forEach(kind => {
      if (!layers[kind]) return;
      const pts = (v.points || {})[kind] || [];
      if (!pts.length) return;
      const max = Math.max(1, ...pts.map(p => p.n || 1));
      ctx.globalCompositeOperation = kind === 'scrolldepth' ? 'source-over' : 'lighter';
      pts.forEach(p => {
        const [r,g,b] = COL[kind], y = (p.y || 0) * scale;
        if (kind === 'scrolldepth') {
          ctx.fillStyle = `rgba(${r},${g},${b},.16)`; ctx.fillRect(0, y-2, W, 4);
          ctx.fillStyle = 'rgba(20,20,19,.72)'; ctx.font = '11px ui-monospace,Menlo,monospace';
          ctx.fillText(`${p.n} still here`, 8, Math.max(12, y-6));
          return;
        }
        // radius scales with how wide the page is drawn, so a desktop shot does not turn into one orange smear
        const unit = Math.max(7, W / 42);
        const x = (p.x == null ? .5 : p.x) * W, rad = unit * (0.7 + 1.1 * Math.sqrt((p.n||1)/max));
        const g2 = ctx.createRadialGradient(x,y,1,x,y,rad);
        g2.addColorStop(0, `rgba(${r},${g},${b},.72)`);
        g2.addColorStop(.45, `rgba(${r},${g},${b},.26)`);
        g2.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(x,y,rad,0,6.2832); ctx.fill();
        ctx.fillStyle = `rgba(${r},${g},${b},.9)`; ctx.beginPath(); ctx.arc(x,y,Math.max(3,rad*.16),0,6.2832); ctx.fill();
      });
      ctx.globalCompositeOperation = 'source-over';
    });
    boxes();
  }

  // ---- a box per finding that has a place on the page
  function boxes() {
    const v = view(); if (!v) return;
    const vp = (v.width || 0) < 700 ? 'mobile' : 'desktop';
    [...document.querySelectorAll('.bx, .mk')].forEach(b => b.remove());
    (D.findings || []).forEach((f, i) => {
      // a marker sits at the exact spot on one viewport; it is not drawn on the other one
      (f.markers || []).filter(mk => !mk.vp || mk.vp === vp).forEach(mk => {
        const d = document.createElement('a');
        d.className = 'mk'; d.href = '#card-f' + i; d.dataset.box = 'f' + i;
        d.style.top = `${100 * (mk.y || 0) / (v.height || 1)}%`;
        d.style.left = `${100 * (mk.x == null ? .5 : mk.x)}%`;
        d.title = mk.label || '';
        d.innerHTML = `<span class="ring"></span><span class="lbl">${esc(mk.label || '')}</span>`;
        $('stage').appendChild(d);
      });
      // a band per section, coloured by how well it holds people - the whole page marked up
      (f.fields || []).filter(fb => !fb.vp || fb.vp === vp).forEach((fb, j) => {
        const d = document.createElement('a');
        d.className = 'bx band field ' + (fb.verdict || 'fix');
        d.id = 'box-f' + i + '-q' + j; d.href = '#card-f' + i; d.dataset.box = 'f' + i;
        d.style.top = `calc(${100 * fb.top / (v.height || 1)}% - 2px)`;
        d.style.height = `calc(${100 * Math.max(24, fb.bottom - fb.top) / (v.height || 1)}% + 4px)`;
        const pw = fb.page_width || v.width || 1;
        if (fb.left != null && fb.width) {          // hug the field itself, never the whole page width
          d.style.left = `calc(${100 * fb.left / pw}% - 3px)`;
          d.style.width = `calc(${100 * fb.width / pw}% + 6px)`;
        }
        d.innerHTML = `<span class="tag">${esc(fb.name)}</span><span class="bandnote">${esc(fb.note || '')}</span>`;
        $('stage').appendChild(d);
      });
      (f.bands || []).filter(bd => !bd.vp || bd.vp === vp).forEach((bd, j) => {
        const d = document.createElement('a');
        d.className = 'bx band ' + (bd.verdict || 'fix');
        d.id = 'box-f' + i + '-b' + j; d.href = '#card-f' + i; d.dataset.box = 'f' + i;
        d.style.top = `calc(${100 * bd.top / (v.height || 1)}% + 2px)`;
        d.style.height = `calc(${100 * (bd.bottom - bd.top) / (v.height || 1)}% - 4px)`;
        d.innerHTML = `<span class="tag">${esc(bd.name)}</span>` +
          `<span class="bandnote">${esc(String(bd.reached))} still here · ${esc(String(bd.left))} left (${esc(String(bd.left_pct))}%)</span>`;
        $('stage').appendChild(d);
      });
      if (f.top == null || f.bottom == null) return;
      const a = document.createElement('a');
      a.className = 'bx ' + (f.verdict || 'fix');
      a.id = 'box-f' + i; a.href = '#card-f' + i;
      a.style.top = `calc(${100 * f.top / (v.height||1)}% + 3px)`;
      a.style.height = `calc(${100 * (f.bottom - f.top) / (v.height||1)}% - 6px)`;
      a.innerHTML = `<span class="tag">${i+1}</span>`;
      a.dataset.box = 'f' + i;
      $('stage').appendChild(a);
      if (f.markers && f.markers.length) a.style.display = 'none';   // a marker is more precise than a band
    });
    wire();
  }

  // ---- toggles
  const tg = [];
  views.forEach((v,i) => tg.push({id:'v'+i, label:v.viewport, on:()=>i===vi, act:()=>{ vi=i; $('shot').src=v.image||''; }}));
  ['click','rageclick','scrolldepth'].forEach(k => tg.push({id:k,
    label: k==='scrolldepth' ? 'how far they got' : (k==='rageclick' ? 'rage clicks' : 'clicks'),
    on:()=>layers[k], act:()=>{ layers[k]=!layers[k]; }}));
  $('tgls').innerHTML = tg.map(b => `<button class="tgl" data-id="${b.id}" aria-pressed="${b.on()}">${esc(b.label)}</button>`).join('');
  $('tgls').addEventListener('click', e => {
    const t = e.target.closest('.tgl'); if (!t) return;
    const b = tg.find(x => x.id === t.dataset.id); if (!b) return;
    b.act(); fit();
    [...$('tgls').querySelectorAll('.tgl')].forEach(x => x.setAttribute('aria-pressed', tg.find(y=>y.id===x.dataset.id).on()));
    setTimeout(draw, 40);
  });
  function fit() { const v = view(); if (v) $('stage').style.maxWidth = ((v.width || 0) < 700 ? 430 : 1180) + 'px'; }
  if (view()) { $('shot').src = view().image || ''; fit(); }
  $('shot').addEventListener('load', draw);
  window.addEventListener('resize', draw);
  setTimeout(draw, 80);

  // ---- summary
  const F = D.findings || [];
  const cut = F.filter(f=>f.verdict==='cut').length, fix = F.filter(f=>f.verdict==='fix').length;
  $('mode').textContent = D.note || '';
  $('bign').textContent = String(F.length);
  $('bigk').textContent = F.length === 1 ? 'thing to look at' : 'things to look at';
  $('chips').innerHTML = [cut?`<span class="chip cut">${cut} broken</span>`:'', fix?`<span class="chip fix">${fix} friction</span>`:'',
    D.clicks?`<span class="chip add">${n(D.clicks)} clicks read</span>`:'', D.sessions?`<span class="chip add">${n(D.sessions)} sessions</span>`:''].join('');
  const top = F.slice(0,3);
  $('first').innerHTML = top.length ? `<h3>Do this first</h3><ol>${top.map(f=>`<li>${esc(f.title)}</li>`).join('')}</ol>` : '';

  // ---- the cards
  const grp = {};
  F.forEach((f,i) => { (grp[f.group||'What the visitors did'] = grp[f.group||'What the visitors did'] || []).push([f,i]); });
  $('cards').innerHTML = Object.entries(grp).map(([g,rows]) => `<div class="grp">${esc(g)}</div>` + rows.map(([f,i]) => `
    <div class="card ${f.verdict||'fix'}" id="card-f${i}" data-box="f${i}">
      <header>
        <span class="num">${i+1}</span>
        <span class="is">${esc(f.title)}</span>
        <span class="vd">${esc(f.verdict==='cut'?'broken':f.verdict==='keep'?'working':'friction')}</span>
      </header>
      ${f.where ? `<div class="hd">${esc(f.where)}</div>` : ''}
      ${f.why ? `<div class="why">${esc(f.why)}</div>` : ''}
      ${f.change ? `<div class="chg"><b>Change:</b> ${esc(f.change)}</div>` : ''}
      ${f.rungs ? `<div class="rw"><h4>The form, rung by rung</h4>${f.rungs.map(r=>`
        <div class="rung ${r.wall?'wall':''}"><span>${esc(r.label)}</span>
          <span class="bar"><i style="width:${Math.round(r.pct||0)}%"></i></span>
          <span class="n">${esc(r.note||'')}</span></div>`).join('')}</div>` : ''}
      ${f.lines ? `<ul class="lines">${f.lines.map(l=>`<li><span class="st ${esc(l.state||'weak')}">${esc(l.state||'')}</span><span>${esc(l.text)}</span></li>`).join('')}</ul>` : ''}
      ${f.moments ? `<div class="clip">${f.moments.map(m=>`<div class="mo"><span class="t">${esc(m.t)}</span><span><b>${esc(m.section)}</b> · ${esc(m.saw)}</span></div>`).join('')}</div>` : ''}
      ${f.video ? `<div class="clip"><video src="${esc(f.video)}" controls preload="metadata"></video><div class="cap">${esc(f.caption||'')}</div></div>` : ''}
    </div>`).join('')).join('');

  function wire() {
    const pane = document.querySelector('.pane');
    function clear() {
      document.querySelectorAll('.bx.live, .mk.live').forEach(b => b.classList.remove('live'));
      document.querySelectorAll('.card.lit').forEach(c => c.classList.remove('lit'));
    }
    function show(id, scrollPane) {
      clear();
      const box = document.getElementById('box-' + id), card = document.getElementById('card-' + id);
      document.querySelectorAll(`.mk[data-box="${id}"]`).forEach(mk => mk.classList.add('live'));
      if (box) {
        box.classList.add('live');
        if (scrollPane && pane) {
          const r = box.getBoundingClientRect(), p = pane.getBoundingClientRect();
          const inView = r.top >= p.top && r.top + Math.min(r.height, p.height) <= p.bottom;
          if (!inView) {
            const want = pane.scrollTop + (r.top - p.top) - (r.height > p.height * 0.9 ? 24 : (p.height - r.height) / 2);
            pane.scrollTo({ top: Math.max(0, want), behavior: 'smooth' });
          }
        }
      }
      if (card) { card.classList.add('lit'); card.scrollIntoView({block:'nearest', behavior:'smooth'}); }
    }
    document.querySelectorAll('[data-box]').forEach(el => {
      el.addEventListener('mouseenter', () => show(el.dataset.box, true));
      el.addEventListener('mouseleave', clear);
      el.addEventListener('click', ev => { ev.stopPropagation(); show(el.dataset.box, true); });
    });
  }
  wire();
})();
</script></body></html>
